# Butterfly 主题配置（覆盖主题默认值，升级主题不受影响）
# 完整配置项文档: https://butterfly.js.org/posts/4aa8abbe/

# 顶部导航菜单
favicon: /img/favicon.ico

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-user-circle

# 头像（圆形裁剪）
avatar:
  img: /img/avatar.jpg
  effect: true

# 侧栏社交图标
social:
  fab fa-github: https://github.com/morphl1ng || GitHub

# 全局背景：雪夜图（视频背景的视频加载失败时的备选）
background: /img/snow-night.svg

# 禁用首页顶部大图，让视频背景完全透出
disable_top_img: true

# 深色模式（导航栏有切换按钮）
darkmode:
  enable: true
  autoChangeMode: false

# 代码块
code:
  copy: true
  copyright:
    enable: true

# 页脚
footer:
  owner:
    enable: true
    since: 2026

# 右侧边栏
aside:
  enable: true
  card_author:
    enable: true
    description: DOTA全能选手（🐟️塘主版
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/morphl1ng
  card_announcement:
    enable: true
    content: 欢迎来到我的博客 🎉

# 不蒜子访问统计——其数据 API 已超时无响应（2026-07 实测），关闭避免加载动画卡死
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# 本地搜索（Butterfly 5.x 新格式；需要 hexo-generator-searchdb，已安装）
search:
  use: local_search
  local_search:
    preload: false

# 评论系统 giscus（基于 GitHub Discussions）
comments:
  use: giscus
  text: true
  count: false
  lazyload: true

giscus:
  repo: morphl1ng/morphl1ng.github.io
  repo_id: R_kgDOTg1WsQ
  category: Announcements
  category_id: DIC_kwDOTg1Wsc4DByV8
  theme:
    light: light
    dark: dark
  option:
    data-mapping: pathname
    data-strict: '0'
    data-reactions-enabled: '1'
    data-emit-metadata: '0'
    data-input-position: bottom
    data-lang: zh-CN

# 注入自定义资源
inject:
  head:
    - <style>#bg-video{position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:-2;pointer-events:none}#bg-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.35);z-index:-1;pointer-events:none}#body-wrap{position:relative;z-index:1}#footer,#footer-wrap,footer{background:transparent!important}#page-header:not(.not-top-img){background:transparent!important;border-bottom:1px solid rgba(255,255,255,0.1)}#nav{background:transparent!important}</style>
  bottom:
    - <video id="bg-video" src="/video/background.mp4" autoplay loop muted playsinline></video>
    - <div id="bg-overlay"></div>
    - <script defer src="/js/snow.js"></script>

# MathJax
math:
  use: mathjax
  per_page: true
  mathjax:
    enableMenu: true
    tags: ams
