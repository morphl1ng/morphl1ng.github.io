# Butterfly 主题配置（覆盖主题默认值，升级主题不受影响）
# 完整配置项文档: https://butterfly.js.org/posts/4aa8abbe/

# 顶部导航菜单
favicon: /img/favicon.ico

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-user-circle

# 侧栏社交图标
social:
  fab fa-github: https://github.com/morphl1ng || GitHub

# 全局背景（默认渐变色；换成二次元背景图时填图片 URL，如:
# background: url(https://你的图床/xxx.jpg)
background:

# 首页顶部大图高度（必须是带单位的字符串，如 '70%'、'100vh'）
index_top_img_height: '70%'

# 深色模式（导航栏有切换按钮）
darkmode:
  enable: true
  autoChangeMode: false

# 代码块
code:
  copy: true
  copyright:
    enable: true

# 页脚
footer:
  owner:
    enable: true
    since: 2026

# 右侧边栏
aside:
  enable: true
  card_author:
    enable: true
    description: 记录与思考
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/morphl1ng
  card_announcement:
    enable: true
    content: 欢迎来到我的博客 🎉

# 不蒜子访问统计——其数据 API 已超时无响应（2026-07 实测），关闭避免加载动画卡死
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# 本地搜索（需要 hexo-generator-searchdb，已安装；菜单栏会出现放大镜）
local_search:
  enable: true
  preload: false

# 评论系统 giscus（基于 GitHub Discussions）
comments:
  use: giscus
  text: true
  count: false
  lazyload: true

giscus:
  repo: morphl1ng/morphl1ng.github.io
  repo_id: R_kgDOTg1WsQ
  category: Announcements
  category_id: DIC_kwDOTg1Wsc4DByV8
  theme:
    light: light
    dark: dark
  option:
    data-mapping: pathname
    data-strict: '0'
    data-reactions-enabled: '1'
    data-emit-metadata: '0'
    data-input-position: bottom
    data-lang: zh-CN

# 注入自定义资源
inject:
  head:
  bottom:
    - <script defer src="/js/snow.js"></script>
