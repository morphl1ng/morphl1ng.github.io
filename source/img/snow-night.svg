<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e23"/>
      <stop offset="0.55" stop-color="#1a2447"/>
      <stop offset="1" stop-color="#333f66"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#fff6dd" stop-opacity="0.85"/>
      <stop offset="0.3" stop-color="#fdf0c8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fdf0c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtnFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9b8d9"/>
      <stop offset="0.3" stop-color="#5d6d99"/>
      <stop offset="1" stop-color="#3c4875"/>
    </linearGradient>
    <linearGradient id="mtnMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3cfe6"/>
      <stop offset="0.35" stop-color="#48557f"/>
      <stop offset="1" stop-color="#2b3557"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3fb"/>
      <stop offset="1" stop-color="#c8d6ec"/>
    </linearGradient>
    <linearGradient id="groundBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c8e2"/>
      <stop offset="1" stop-color="#8fa2c6"/>
    </linearGradient>
    <g id="pine">
      <polygon points="0,-64 -20,-16 20,-16" fill="#131f33"/>
      <polygon points="0,-48 -26,-2 26,-2" fill="#0e1828"/>
      <polygon points="0,-30 -32,16 32,16" fill="#0b1421"/>
      <rect x="-4" y="16" width="8" height="14" fill="#0b1421"/>
      <polygon points="0,-64 -9,-46 9,-46" fill="#dfe9f6" opacity="0.9"/>
    </g>
  </defs>

  <!-- 夜空 -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- 星星 -->
  <g fill="#ffffff">
    <circle cx="120" cy="90" r="1.6" opacity="0.9"/>
    <circle cx="260" cy="180" r="1.2" opacity="0.6"/>
    <circle cx="380" cy="70" r="2" opacity="0.8"/>
    <circle cx="520" cy="150" r="1.3" opacity="0.5"/>
    <circle cx="660" cy="60" r="1.7" opacity="0.85"/>
    <circle cx="790" cy="200" r="1.2" opacity="0.55"/>
    <circle cx="900" cy="110" r="2.2" opacity="0.9"/>
    <circle cx="1040" cy="70" r="1.4" opacity="0.6"/>
    <circle cx="1180" cy="160" r="1.8" opacity="0.75"/>
    <circle cx="1300" cy="90" r="1.2" opacity="0.5"/>
    <circle cx="1560" cy="70" r="1.6" opacity="0.7"/>
    <circle cx="1700" cy="170" r="1.3" opacity="0.55"/>
    <circle cx="1830" cy="90" r="1.9" opacity="0.85"/>
    <circle cx="70" cy="300" r="1.3" opacity="0.5"/>
    <circle cx="450" cy="280" r="1.5" opacity="0.6"/>
    <circle cx="830" cy="320" r="1.2" opacity="0.45"/>
    <circle cx="1120" cy="280" r="1.6" opacity="0.6"/>
    <circle cx="1620" cy="300" r="1.4" opacity="0.5"/>
    <circle cx="1880" cy="260" r="1.2" opacity="0.45"/>
    <circle cx="240" cy="380" r="1.3" opacity="0.4"/>
    <circle cx="990" cy="400" r="1.4" opacity="0.4"/>
    <circle cx="1400" cy="380" r="1.2" opacity="0.4"/>
  </g>

  <!-- 月亮与光晕 -->
  <circle cx="1470" cy="190" r="260" fill="url(#moonGlow)"/>
  <circle cx="1470" cy="190" r="82" fill="#fff7e0"/>
  <circle cx="1445" cy="170" r="16" fill="#f2e4bd" opacity="0.7"/>
  <circle cx="1495" cy="215" r="11" fill="#f2e4bd" opacity="0.6"/>
  <circle cx="1462" cy="222" r="7" fill="#f2e4bd" opacity="0.5"/>

  <!-- 远山（雪顶） -->
  <path fill="url(#mtnFar)" opacity="0.85" d="M0,620 L210,430 L330,545 L470,400 L640,590 L820,430 L980,585 L1150,470 L1330,620 L1520,480 L1700,610 L1830,520 L1920,570 L1920,1080 L0,1080 Z"/>

  <!-- 中山 -->
  <path fill="url(#mtnMid)" d="M0,730 L160,560 L310,690 L500,520 L700,730 L900,560 L1090,720 L1290,590 L1480,750 L1660,610 L1830,730 L1920,660 L1920,1080 L0,1080 Z"/>

  <!-- 后方雪原 -->
  <path fill="url(#groundBack)" d="M0,830 Q320,770 700,810 T1400,800 Q1700,780 1920,810 L1920,1080 L0,1080 Z"/>

  <!-- 前方雪原 -->
  <path fill="url(#ground)" d="M0,900 Q400,850 860,885 T1920,870 L1920,1080 L0,1080 Z"/>

  <!-- 松林 -->
  <use href="#pine" transform="translate(180,845) scale(1.1)"/>
  <use href="#pine" transform="translate(250,860) scale(0.8)"/>
  <use href="#pine" transform="translate(120,868) scale(0.65)"/>
  <use href="#pine" transform="translate(560,850) scale(0.9)"/>
  <use href="#pine" transform="translate(625,868) scale(0.6)"/>
  <use href="#pine" transform="translate(1120,855) scale(1)"/>
  <use href="#pine" transform="translate(1190,872) scale(0.7)"/>
  <use href="#pine" transform="translate(1700,850) scale(1.15)"/>
  <use href="#pine" transform="translate(1780,868) scale(0.75)"/>
  <use href="#pine" transform="translate(1860,858) scale(0.9)"/>

  <!-- 雪夜小屋（暖灯） -->
  <g transform="translate(1380,845)">
    <ellipse cx="46" cy="58" rx="70" ry="14" fill="#ffd98e" opacity="0.18"/>
    <rect x="0" y="0" width="92" height="58" fill="#1a2540"/>
    <polygon points="-14,2 46,-42 106,2" fill="#e8effa"/>
    <polygon points="-14,2 46,-42 106,2 100,8 46,-32 -8,8" fill="#f4f8fd"/>
    <rect x="33" y="16" width="26" height="24" fill="#ffd98e"/>
    <rect x="33" y="16" width="26" height="24" fill="none" stroke="#1a2540" stroke-width="3"/>
    <line x1="46" y1="16" x2="46" y2="40" stroke="#1a2540" stroke-width="3"/>
    <rect x="70" y="-28" width="10" height="20" fill="#223050"/>
    <circle cx="75" cy="-36" r="6" fill="#ffffff" opacity="0.35"/>
    <circle cx="79" cy="-48" r="8" fill="#ffffff" opacity="0.22"/>
    <circle cx="84" cy="-62" r="10" fill="#ffffff" opacity="0.12"/>
  </g>
</svg>
